# Correctness of the DuckDB extension against the simulated Oasis vFPGA under Verilator.
# Job build: scripts/ci/pin_submodules.sh moves parcore, libstf and Coyote to the commits of scripts/ci/PINS;
# scripts/ci/sim_build.sh builds the software stack, the Verilator binary (no Vivado: sim/vl/configure.sh
# of the Coyote submodule) and the DuckDB shell; scenarios/correctness/prepare.py writes the data and the
# scenarios; scripts/ci/bundle.sh packs it all. Job run: one leg per scenario (the 22 TPC-H queries, the
# edge cases and the known gaps), each compares read_oasis with read_parquet on the same files.
# The first run builds DuckDB (about an hour on the hosted runner); later runs take its objects from the ccache cache.
name: Simulation

on:
  push:
    branches: [features/system-sim, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      scenarios: ${{ steps.prepare.outputs.scenarios }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # celeris is private and the Coyote network stack is not simulated: only what the build needs.
    - name: Submodules
      run: |
        # .gitmodules of Oasis and libstf name parcore and Coyote over SSH; the runner has no key, every repo is public.
        git config --global url.https://github.com/.insteadOf git@github.com:
        git submodule update --init --depth 1 extension/duckdb extension/extension-ci-tools parcore
        git -C parcore submodule update --init --depth 1 libstf vhsnunzip
        git -C parcore/libstf submodule update --init --depth 1 coyote

    - name: Pin the submodules to the recorded commits
      run: scripts/ci/pin_submodules.sh

    # GHDL for the vhsnunzip model, and a Verilator at or after the pin of sim/vl/verilator.env of the
    # Coyote submodule (build.sh refuses an older one): move this release with that pin.
    - uses: YosysHQ/setup-oss-cad-suite@v3
      with:
        version: '2026-10-23'

    - name: Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build ccache libboost-all-dev autoconf unzip wget jq
        python3 -m pip install --user duckdb pyarrow jinja2
        verilator --version && ghdl --version | head -1 && cmake --version | head -1

    - name: Cache keys
      run: |
        echo "DUCKDB_SHA=$(git -C extension/duckdb rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

    - name: jemalloc cache
      uses: actions/cache@v4
      with:
        path: ~/opt
        key: jemalloc-5.3.0

    - name: ccache cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ env.DUCKDB_SHA }}-${{ hashFiles('extension/src/**', 'extension/CMakeLists.txt') }}
        restore-keys: |
          ccache-${{ env.DUCKDB_SHA }}-
          ccache-

    - name: Build
      run: |
        ccache --max-size 2G --zero-stats
        scripts/ci/sim_build.sh
        ccache --show-stats

    - name: Scenarios
      id: prepare
      run: |
        python3 scenarios/correctness/prepare.py
        echo "scenarios=$(cat scenarios/correctness/out/scenarios.json)" >> "$GITHUB_OUTPUT"

    - name: Bundle
      run: scripts/ci/bundle.sh "$RUNNER_TEMP/sim-bundle.tar.gz"

    - uses: actions/upload-artifact@v4
      with:
        name: sim-bundle
        path: ${{ runner.temp }}/sim-bundle.tar.gz
        compression-level: 0  # already gzip
        retention-days: 1

    - name: Build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        if-no-files-found: ignore
        path: |
          ${{ runner.temp }}/sim-vl/build.log
          ${{ runner.temp }}/sim-build/*.log

  run:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.build.outputs.scenarios) }}
    name: ${{ matrix.scenario }}
    # The gap legs show as failed but do not fail the run:
    # (NULLs, BOOLEAN, Parquet V2 encodings, V2 data pages).
    continue-on-error: ${{ startsWith(matrix.scenario, 'gap_') }}

    steps:
    # run.py, the scenario scripts and hardware/src/vfpga_top.svh; the bundle brings the rest.
    - uses: actions/checkout@v4
      with:
        submodules: false

    - uses: actions/download-artifact@v4
      with:
        name: sim-bundle
        path: ${{ runner.temp }}

    - name: Unpack
      run: tar -xPzf "$RUNNER_TEMP/sim-bundle.tar.gz"

    - name: Run ${{ matrix.scenario }}
      env:
        TIMEOUT: ${{ startsWith(matrix.scenario, 'gap_') && 180 || 600 }}
      run: scripts/ci/run_scenario.sh ${{ matrix.scenario }}

    - name: Summary
      if: always()
      run: |
        r=runs/${{ matrix.scenario }}/result.json
        if [ -f "$r" ]; then
          jq -r '"\(.scenario): pass=\(.pass) rc=\(.rc) wall_s=\(.wall_s) simulated_ns=\(.simulated_ns)", (.checks[] | select(.ok | not) | "failed: \(.got)")' "$r" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "${{ matrix.scenario }}: no result.json, the run stopped before the scenario" | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - name: Run folder
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: run-${{ matrix.scenario }}
        if-no-files-found: ignore
        path: runs/${{ matrix.scenario }}
